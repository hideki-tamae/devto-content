# Set the 'DEVTO_API_KEY' repo secret (dev.to -> Settings -> Extensions -> DEV API Keys)
name: Publish to dev.to

on:
  push:
    branches:
      - main
    paths:
      - "articles/**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run publish
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

      - name: Commit new article IDs back to the repo
        run: |
          if [ -f .publish-changed ]; then
            rm .publish-changed
            git config user.name "devto-publish-bot"
            git config user.email "actions@users.noreply.github.com"
            git add articles/
            git diff --cached --quiet || git commit -m "chore: record dev.to article id"
            git push
          fi
